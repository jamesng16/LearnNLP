[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vietnamese-nlp-mastery"
version = "0.1.0"
description = "Practical roadmap, benchmarks, and end-to-end pipelines for Vietnamese NLP — from Unicode & Word Segmentation to PhoBERT/ViT5 and Vietnamese LLMs & Agentic RAG."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Vietnamese NLP Mastery Contributors" }
]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "tqdm>=4.65.0",
    "regex>=2023.6.3",
]

[project.optional-dependencies]
foundations = [
    "pyvi>=0.1.1",
    "underthesea>=6.8.0",
    "py-vncorenlp>=0.1.4",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]
embeddings = [
    "scikit-learn>=1.3.0",
    "gensim>=4.3.0",
]
transformers = [
    "torch>=2.1.0",
    "transformers>=4.38.0",
    "datasets>=2.18.0",
    "accelerate>=0.27.0",
    "evaluate>=0.4.1",
    "seqeval>=1.2.2",
    "rouge-score>=0.1.2",
    "sentencepiece>=0.2.0",
]
llm_rag = [
    "peft>=0.10.0",
    "trl>=0.8.0",
    "sentence-transformers>=2.6.0",
    "rank-bm25>=0.2.2",
    "langgraph>=0.2.0",
    "langchain-core>=0.2.0",
    "faiss-cpu>=1.8.0",
]
web = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.6.0",
]
dev = [
    "jupyter>=1.0.0",
    "ipykernel>=6.25.0",
    "nbformat>=5.9.0",
    "ruff>=0.4.0",
    "pytest>=8.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
